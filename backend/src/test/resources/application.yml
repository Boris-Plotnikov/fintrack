spring:
  datasource:
    url: jdbc:h2:mem:fintrack;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

fintrack:
  timezone: Europe/Vienna
  large-amount-eur: 5000
  late-correction-hours: 24
  large-correction-eur: 500
  demo-mode: true
  demo-password: demo
  reset-cron: "-"

logging:
  file:
    name: target/test.log
